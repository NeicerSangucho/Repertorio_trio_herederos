<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Herederos — Repertorio</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Librerías de PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<!-- Tu archivo CSS separado -->
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <img src="logo.png" alt="Logo Trío Los Herederos" class="logo-img">
  <div class="eyebrow">Trío musical</div>
  <h1>Los <span>Herederos</span></h1>
  <p>Arma tu repertorio ideal para el evento: elige el ambiente, el género y las canciones exactas.</p>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="toggleEditMode()" id="editToggleBtn">✎ Modo edición</button>
  </div>
</header>

<div class="stepper" id="stepper"></div>
<div id="editToolbar"></div>

<main id="main"></main>

<section id="ayuda">
  <div class="box">
    <h2>Guía rápida</h2>
    <h4>1. Archivos PDF y Logo</h4>
    <p>Asegúrate de tener tu <code>logo.png</code> y tu carpeta <code>pdf/</code> con las letras en tu repositorio de GitHub.</p>
  </div>
</section>

<div class="toast" id="toast"></div>

<!-- Tus archivos JS separados -->
<script src="js/pdf-handler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
